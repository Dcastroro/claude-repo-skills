name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Zero runtime dependencies and a ~0.4s test suite: a 3-version matrix bought no real
          # compatibility coverage here. Node 20 reached EOL in April 2026; 22 is current LTS.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
